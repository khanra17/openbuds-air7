<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
<title id="title">Independent OpenBuds SDK, native ABI and applications</title><desc id="desc">Rust applications call an explicit device driver. Other languages use the versioned C ABI. Platform transports contain no device commands. Only the Air7 driver is currently implemented.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67e8d0"/></marker></defs>
<rect width="1120" height="550" rx="20" fill="#101c2e"/>
<g font-family="system-ui, sans-serif" text-anchor="middle"><text x="560" y="43" fill="#eef7ff" font-size="23" font-weight="650">Device behavior is not a frontend or a platform backend</text>
<g fill="#1c3048" stroke="#425973"><rect x="60" y="76" width="430" height="76" rx="12"/><rect x="630" y="76" width="430" height="76" rx="12"/><rect x="630" y="190" width="430" height="72" rx="12"/><rect x="60" y="302" width="1000" height="91" rx="12"/><rect x="60" y="443" width="430" height="69" rx="12"/><rect x="630" y="443" width="430" height="69" rx="12"/></g>
<g fill="#eef7ff" font-size="19"><text x="275" y="107">Rust hosts</text><text x="845" y="107">C / Python / other language hosts</text><text x="845" y="221">Versioned C ABI</text><text x="560" y="336" font-weight="650">Explicit device SDK · devices::air7</text><text x="275" y="470">Windows RFCOMM adapter</text><text x="845" y="470">Application-provided timed stream</text></g>
<g fill="#b5c6d9" font-size="15"><text x="275" y="132">CLI and desktop are separate applications</text><text x="845" y="132">Prebuilt shared library · no Rust installation</text><text x="845" y="245">Model selection · handles · buffers · callbacks</text><text x="560" y="365">Air7 codec, opcodes, typed state, semantics, safety and optional JSON</text><text x="275" y="495">Explicit service UUID · no model defaults</text><text x="845" y="495">Future host bridge · not a shipped Android app</text></g>
<g stroke="#67e8d0" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M275 152V290"/><path d="M845 152V180"/><path d="M845 262V290"/><path d="M275 393V432"/><path d="M845 393V432"/></g></g></svg>
