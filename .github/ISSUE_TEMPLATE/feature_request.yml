name: Feature or protocol finding
description: Propose a scoped change or share sanitized interoperability evidence
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature and model/firmware scope
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Transport, UI or host-side behavior?
      description: Distinguish observations from hypotheses and describe relevant state branches
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and safety constraints
      description: Sanitized protocol facts only; no APK/decompiled source, addresses, raw captures or firmware
