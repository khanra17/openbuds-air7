[workspace]
members = ["crates/realme-buds", "crates/realme-buds-windows", "crates/realme-buds-ffi", "apps/cli", "apps/desktop"]
default-members = ["crates/realme-buds", "crates/realme-buds-windows", "crates/realme-buds-ffi"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/khanra17/openbuds-air7"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
