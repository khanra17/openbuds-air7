<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">OpenBuds architecture</title><desc id="desc">The desktop and CLI share the realme-buds protocol and semantic library. Native Windows RFCOMM communicates with Air7. Offline demo never creates a transport.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#61d5c5"/></marker></defs>
<rect width="1200" height="400" rx="18" fill="#101827"/>
<g fill="none" stroke="#61d5c5" stroke-width="3" marker-end="url(#arrow)"><path d="M286 110H346V192H406"/><path d="M286 278H346V208H406"/><path d="M710 200H774"/><path d="M998 200H1060"/></g>
<g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
<rect x="48" y="56" width="238" height="108" rx="14" fill="#192a3b" stroke="#314a60"/><text x="167" y="98" fill="#eff5ff" font-size="24" font-weight="600">Windows desktop</text><text x="167" y="130" fill="#a9c2d5" font-size="17">UI + background actor</text>
<rect x="48" y="224" width="238" height="108" rx="14" fill="#192a3b" stroke="#314a60"/><text x="167" y="266" fill="#eff5ff" font-size="24" font-weight="600">JSON CLI</text><text x="167" y="298" fill="#a9c2d5" font-size="17">Arguments + commands</text>
<rect x="406" y="94" width="304" height="214" rx="14" fill="#17373f" stroke="#61d5c5"/><text x="558" y="140" fill="#eff5ff" font-size="28" font-weight="700">realme-buds</text><text x="558" y="183" fill="#bedee0" font-size="19">Typed + raw state</text><text x="558" y="217" fill="#bedee0" font-size="19">Semantics · client · codec</text><text x="558" y="259" fill="#75e1d3" font-size="17">One shared protocol core</text>
<rect x="774" y="130" width="224" height="140" rx="14" fill="#192a3b" stroke="#314a60"/><text x="886" y="178" fill="#eff5ff" font-size="23" font-weight="600">Native transport</text><text x="886" y="217" fill="#a9c2d5" font-size="18">Windows RFCOMM</text>
<rect x="1060" y="147" width="96" height="106" rx="14" fill="#17373f" stroke="#61d5c5"/><text x="1108" y="210" fill="#eff5ff" font-size="24" font-weight="700">Air7</text>
<text x="600" y="370" fill="#829aaf" font-size="17">Offline demo: synthetic state only, no Bluetooth worker or transport.</text>
</g></svg>
