name: Native SDK
on:
  workflow_call:
permissions:
  contents: read
jobs:
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: notices
      - run: cargo install cargo-about --version 0.9.2 --locked
      - run: mkdir -p target && cargo about generate about.hbs --output-file target/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-notices
          path: target/THIRD_PARTY_LICENSES.html
          retention-days: 14
  native:
    needs: notices
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: dependency-notices
          path: target/notices
      - id: host
        run: echo "target=$(rustc -vV | awk '/^host:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
      - run: cargo build -p realme-buds-ffi --release --locked --target ${{ steps.host.outputs.target }}
      - id: package
        run: echo "sdk_dir=$(python scripts/package_sdk.py --target ${{ steps.host.outputs.target }} --notices target/notices/THIRD_PARTY_LICENSES.html)" >> "$GITHUB_OUTPUT"
      - name: Build a standalone C consumer from the packaged SDK
        run: |
          cmake -S "${{ steps.package.outputs.sdk_dir }}/examples/c" -B target/sdk-c -DCMAKE_BUILD_TYPE=Release -DOPENBUDS_SDK_DIR="${{ github.workspace }}/${{ steps.package.outputs.sdk_dir }}"
          cmake --build target/sdk-c --config Release
          ctest --test-dir target/sdk-c -C Release --output-on-failure
      - name: Load the packaged binary from Python without building Rust
        run: |
          sdk="${{ steps.package.outputs.sdk_dir }}"
          if [[ "$RUNNER_OS" == Windows ]]; then lib="$sdk/bin/openbuds.dll"; elif [[ "$RUNNER_OS" == macOS ]]; then lib="$sdk/lib/libopenbuds.dylib"; else lib="$sdk/lib/libopenbuds.so"; fi
          python "$sdk/examples/python/openbuds.py" "$lib"
      - uses: actions/upload-artifact@v4
        with:
          name: openbuds-sdk-${{ steps.host.outputs.target }}
          path: |
            target/sdk/*.zip
            target/sdk/*.sha256
          if-no-files-found: error
          retention-days: 14
